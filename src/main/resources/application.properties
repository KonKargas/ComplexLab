# ComplexLab local development configuration
spring.application.name=complexlab

# Relative to the directory from which the application is launched.
# Create the data/ directory before starting the application.
spring.datasource.url=${COMPLEXLAB_DB_URL:jdbc:sqlite:data/complexlab.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
