
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<header class="app-topbar"
        th:fragment="topbar(pageTitle)">

    <div class="topbar-left">
        <button type="button"
                class="sidebar-toggle"
                id="sidebarToggle"
                aria-label="Toggle sidebar"
                aria-controls="appSidebar"
                aria-expanded="true">
            ☰
        </button>

        <h1 class="topbar-title" th:text="${pageTitle}">
            Dashboard
        </h1>
    </div>

    <div class="topbar-right">
        <span class="topbar-label">ComplexLab</span>
        <span class="topbar-indicator" aria-hidden="true"></span>
    </div>

</header>

</body>
</html>
